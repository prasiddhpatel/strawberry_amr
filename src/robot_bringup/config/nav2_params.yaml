# =============================================================================
# Nav2 parameters for the strawberry AMR.
#
# Nav2 provides the EXPLICIT geometric path-planning + tracking layer used for
# the discrete plant-approach phase (NavigateToPose to a mapped strawberry).
# Row-following itself is handled by the reactive row_navigation node; Nav2 is
# NOT in the row-following loop.
#
#   * Global planner  : Smac HYBRID Planner (nav2_smac_planner/SmacPlannerHybrid)
#                       -- NOT SmacPlanner2D. 2D grid search ignores the
#                       vehicle's minimum turning radius and can return paths
#                       this Ackermann chassis cannot physically follow.
#                       Hybrid-A* with a Dubins motion model respects
#                       min_turning_radius (R_min = 0.344 m, CAD-sourced from the
#                       real yahboomcar_R2.urdf.xacro -- see
#                       docs/MOTOR_AND_GEOMETRY_VERIFICATION.md for the extraction)
#                       and
#                       forward-only curvature (no reverse -- we do not want
#                       Nav2 planning a reverse approach into a strawberry
#                       bed; headland reversing is handled separately and
#                       deliberately by row_navigation's bulb-turn, not Nav2).
#   * Local controller: Regulated Pure Pursuit, reconfigured for a car-like
#                       (non-holonomic) base: use_rotate_to_heading is FALSE
#                       (an Ackermann vehicle cannot rotate in place -- this
#                       was left "true" in an earlier draft of this file,
#                       which would have commanded a physically impossible
#                       motion at the goal -- an Ackermann chassis has no way
#                       to execute v=0,omega!=0 at all) and min_turning_radius
#                       matches R_min (see note above on its sourcing) so the
#                       controller never
#                       asks for more curvature than the chassis can deliver.
#
# Heavier than the old SmacPlanner2D, but Nav2 only runs in short bursts
# during the discrete plant-approach phase (Section: Two-Phase Operation in
# the deployment guide), not continuously -- the extra per-call cost is
# accepted in exchange for paths the robot can actually drive.
#
# The controller's /cmd_vel output is remapped to /cmd_vel_nav in the launch
# file and arbitrated by twist_mux (nav priority > row-following priority), so
# Nav2 owns velocity only while an approach goal is active.
# =============================================================================

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    # Ackermann cannot execute the Spin recovery (see behavior_server below,
    # where 'spin' is deliberately NOT registered). The stock Nav2 default
    # trees reference it, which would fail to find the action server. This
    # workspace ships a trimmed copy with Spin replaced by an extra
    # Backup+Wait cycle -- see behavior_trees/navigate_to_pose_ackermann.xml.
    default_nav_to_pose_bt_xml: $(find-pkg-share robot_bringup)/behavior_trees/navigate_to_pose_ackermann.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.15
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35        # deliberately SLOWER than row-following's 1.2 m/s
                                       # walking pace -- precision over speed for the final
                                       # approach to a delicate plant, not a rushed transit
      lookahead_dist: 0.40
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.05
      # --- Ackermann / car-like kinematics (FIXED vs. an earlier draft of
      # this file, which left use_rotate_to_heading: true -- physically
      # impossible for this chassis; an Ackermann vehicle cannot rotate in
      # place, so RPP must never be allowed to plan one) ---
      use_rotate_to_heading: false
      min_turning_radius: 0.344       # R_min = L/tan(delta_max), CAD-sourced; see MOTOR_AND_GEOMETRY_VERIFICATION.md re: sourcing
      max_angular_accel: 1.0
      allow_reversing: false          # matches the Hybrid planner's forward-only
                                       # (Dubins) motion model below -- do not set
                                       # one of these without the other
      max_robot_pose_search_dist: 3.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0   # lower than SmacPlanner2D's 5.0 -- Hybrid-A* with
                                       # motion primitives costs more per call; acceptable
                                       # since Nav2 only runs in short Phase-2 approach bursts
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "DUBIN"   # forward-only -- matches allow_reversing:false
                                          # on the controller above; do not change one
                                          # without the other
      angle_quantization_bins: 72
      minimum_turning_radius: 0.344      # R_min = L/tan(delta_max), CAD-sourced; see MOTOR_AND_GEOMETRY_VERIFICATION.md re: sourcing
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 0.6
      cache_obstacle_heuristic: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # 'spin' DELIBERATELY NOT registered: an Ackermann vehicle cannot
    # rotate in place -- v=0,omega!=0 is not a physically achievable command
    # on this chassis at all, regardless of what handles the conversion (see
    # base_controller_node.py). If left registered (as in an earlier draft),
    # the default BT's recovery round-robin would invoke it and the behavior
    # would likely report SUCCESS after its timer expired having moved the
    # robot not at all -- a silent no-op recovery that LOOKS like it worked.
    # Backup (straight reverse) and Wait are real, executable
    # recoveries for this chassis; the matching custom BT XML
    # (behavior_trees/navigate_to_pose_ackermann.xml) does not reference
    # Spin either -- keep both in sync if you ever revisit this.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # max/min_rotational_vel and rotational_acc_lim were Spin-only params;
    # removed along with Spin above rather than left as dead config.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20    # half-diagonal of the smaller Ackermann chassis envelope
                            # (conservative circular approximation of a
                            # rectangular footprint; was 0.23 m, sized for
                            # the old, much larger 4WD rig)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.20    # half-diagonal of the smaller Ackermann chassis envelope
                            # (conservative circular approximation of a
                            # rectangular footprint; was 0.23 m, sized for
                            # the old, much larger 4WD rig)
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: true
