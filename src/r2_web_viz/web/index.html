<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>R2 Live View</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three.module.js"
  }
}
</script>
</head>
<body>

<header id="topbar">
  <div id="brand">R2 <span id="brand-sub">live view</span></div>
  <div id="conn-status" class="disconnected">
    <span class="dot"></span><span class="label">connecting&hellip;</span>
  </div>
  <div id="host-field">
    <label for="host-input">rosbridge</label>
    <input id="host-input" type="text" spellcheck="false">
    <button id="host-connect">connect</button>
  </div>
</header>

<nav id="tabbar">
  <button class="tab-btn active" data-panel="panel-map">2D Map</button>
  <button class="tab-btn" data-panel="panel-3d">3D View</button>
  <button class="tab-btn" data-panel="panel-cam">Camera</button>
</nav>

<main id="panels">
  <section id="panel-map" class="panel active">
    <canvas id="map-canvas"></canvas>
    <div class="panel-toolbar">
      <label><input type="checkbox" id="map-follow" checked> follow robot</label>
      <button id="map-clear-trail">clear real trail</button>
      <div class="legend">
        <span><i class="swatch real"></i>real trajectory</span>
        <span><i class="swatch assumed"></i>assumed trajectory</span>
      </div>
    </div>
  </section>

  <section id="panel-3d" class="panel">
    <div id="view3d-container"></div>
    <div class="panel-toolbar">
      <span id="points-count">0 accumulated points</span>
      <label><input type="checkbox" id="pc3d-follow"> follow robot</label>
    </div>
  </section>

  <section id="panel-cam" class="panel">
    <img id="cam-img" alt="camera stream">
    <div class="panel-toolbar">
      <span id="cam-status">not connected</span>
    </div>
  </section>
</main>

<script src="js/vendor/roslib.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
