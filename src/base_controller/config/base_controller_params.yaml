base_controller_node:
  ros__parameters:
    # ---- serial link to YB-ERF01-V2.0, via Rosmaster_Lib (vendored --
    # see base_controller/vendor/Rosmaster_Lib.py). The library owns the
    # actual wire protocol and baud rate (115200, fixed inside the library
    # itself, not configurable here) -- this node only needs the port. ----
    serial_port: /dev/myserial   # matches Rosmaster_Lib's own default name;
                                  # see scripts/setup_udev_rules.sh, which
                                  # creates this symlink
    poll_rate_hz: 20.0           # odometry/IMU/battery/encoder publish rate

    # ---- command limits (also firmware-enforced inside set_car_motion,
    # these are a defensive clamp before the command ever reaches it) ----
    max_linear_mps: 1.8          # R2/R2L set_car_motion vx range, confirmed
                                  # from Rosmaster_Lib.py's own docstring
    max_angular_radps: 3.0       # R2/R2L set_car_motion vz range, ditto

    # ---- Ackermann steering -- added 2026-08-31 after Stage 9 bench testing
    # confirmed the front servo works (docs/MASTER_DEPLOYMENT_COMMANDS.md,
    # see base_controller_node.py's module docstring for the full trail).
    #
    # wheelbase below is the TRUE, physically measured value (bench-confirmed
    # again 2026-08-31: exactly 0.2353 m) -- this node talks directly to the
    # real servo, so it must use the real geometry, not a planning margin.
    #
    # UPDATED 2026-08-31 -- the old "3-file MUST MATCH" rule (this file,
    # row_navigation_params.yaml, strawberry_amr.urdf.xacro) is RETIRED for
    # wheelbase specifically. It is now a deliberate 2-way split:
    #   - ACTUATION layer (real hardware/geometry) = 0.2353 m: this file,
    #     robot_description/urdf/strawberry_amr.urdf.xacro, and
    #     strawberry_amr_sim.urdf.xacro's Gazebo drive plugin (it plays this
    #     same actuation role in sim, not the planning role).
    #   - PLANNING layer (kinematic model only, never touches real hardware)
    #     = 0.25 m, deliberately rounder/more conservative: row_navigation's
    #     wheelbase param and Nav2's min_turning_radius (derived, see
    #     robot_bringup/config/nav2_params.yaml).
    # See docs/HEADLAND_TURN_GEOMETRY.md for why. Do NOT edit this file's
    # wheelbase to match row_navigation_params.yaml's 0.25 -- that would
    # miscalibrate the real steering-angle law below against the actual
    # servo. max_steer_angle, unlike wheelbase, was NOT split -- it still
    # must match across all of the files above; grep it before trusting one.
    wheelbase: 0.2353            # m -- L in the bicycle model below (TRUE value, see above)
    max_steer_angle: 0.6         # rad (34.4 deg) -- CAD joint limit; also
                                  # clamped again in code against the vendor
                                  # library's own hard +/-45 deg servo range
    min_steer_vx: 0.05           # m/s -- below this |vx|, delta=atan(L*vz/vx)
                                  # is numerically unreliable (vx near zero);
                                  # hold the last computed steering angle
                                  # instead of recomputing from a near-zero
                                  # denominator. Small enough that a normal
                                  # forward stick push still engages steering
                                  # promptly.

    # ---- TF ----
    publish_tf: false            # leave false when an EKF (robot_localization)
                                  # is running -- it should own odom->base_link.
                                  # Only set true for a bench test of this node
                                  # in isolation with nothing else publishing TF.
    base_frame: base_link
    odom_frame: odom

    # ---- safety ----
    cmd_watchdog_timeout_s: 0.5  # s   no /cmd_vel within this -> stop the robot
    max_linear_accel_mps2: 1.0   # see command_safety.py's module docstring --
                                  # NEVER limits deceleration/braking, only
                                  # increasing |velocity|. Generous relative to
                                  # actual operating speeds (row-following/
                                  # headland are 0.06-0.35 m/s); exists to catch
                                  # a sudden, erroneous full-speed step command.
    battery_warn_v: 9.6          # V   3S LiPo warn threshold (3.2 V/cell)
    battery_critical_v: 9.0      # V   3S LiPo critical threshold (3.0 V/cell)
                                  # Scale factor confirmed from Rosmaster_Lib
                                  # source: get_battery_voltage() returns
                                  # raw_register / 10.0 -- see base_controller_node.py's
                                  # module docstring for the full verification trail.
