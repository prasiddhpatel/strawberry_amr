joystick_node:
  ros__parameters:
    # ---- axes (confirm with: ros2 topic echo /joy) ----
    axis_linear: 1          # left stick vertical
    axis_angular: 2         # right stick horizontal (often 2 or 3 on adapters)
    invert_linear: false
    invert_angular: false
    # ---- buttons ----
    deadman_button: 6       # L1  (HOLD to drive)
    turbo_button: 7         # R1  (HOLD for fast)
    autonomy_button: 0      # X / cross (tap to toggle autonomy, deadman released)
    estop_button: 1         # circle (tap to latch e-stop)
    reset_button: 9         # start  (tap to clear e-stop)
    # ---- speeds ----
    # Deliberately conservative defaults for a FIRST power-on test of the
    # drivetrain (see teleop.launch.py's docstring). Raise once you've
    # confirmed the robot drives/steers correctly and you're comfortable --
    # the chassis is rated up to ~1.87 m/s (docs/MOTOR_AND_GEOMETRY_VERIFICATION.md).
    max_linear: 0.30
    max_angular: 0.8
    turbo_linear: 0.5
    turbo_angular: 1.2
    deadzone: 0.08

    # ---- staleness -- see this node's own module docstring. The critical
    # network-independence property (teleop only publishing while the
    # deadman is genuinely held) comes from joy_cb() itself, not this
    # timeout -- this specifically keeps this node's OWN deadman_live
    # bookkeeping/logging from claiming "still held" forever after the
    # controller has actually gone quiet (disconnected dongle, etc.) ----
    joy_stale_timeout_s: 0.5
