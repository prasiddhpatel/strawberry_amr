joystick_node:
  ros__parameters:
    # ---- axes -- bench-verified 2026-08-30 against the real controller
    # (generic PS2-layout USB adapter, Y/B/A/X-labelled face buttons in
    # Triangle/Circle/Cross/Square positions), see docs/MASTER_DEPLOYMENT_
    # COMMANDS.md Stage 8. Confirmed via ros2 topic echo /joy: axis 1 reads
    # +1.0 on forward push (-> positive cmd.linear.x, correct as-is, no
    # invert needed); axis 2 reads +1.0 on left push (-> positive
    # cmd.angular.z = turn left per REP-103, correct as-is) ----
    axis_linear: 1          # left stick vertical
    axis_angular: 2         # right stick horizontal
    invert_linear: false
    invert_angular: false
    # ---- buttons -- bench-verified 2026-08-30, same session ----
    deadman_button: 6       # L1  (HOLD to drive)
    turbo_button: 7         # R1  (HOLD for fast)
    autonomy_button: 0      # X / cross (tap to toggle autonomy, deadman released)
    estop_button: 1         # circle (tap to latch e-stop)
    reset_button: 11        # start (tap to clear e-stop) -- WAS 9 (a guess);
                             # bench-verified 2026-08-30 that button 9 is
                             # actually R2 (digital press), not start -- real
                             # start is 11. Left uncorrected, R2 (a trigger,
                             # easy to bump while driving) would have silently
                             # cleared a latched e-stop, and the real start
                             # button would have done nothing. See docs/
                             # MASTER_DEPLOYMENT_COMMANDS.md Stage 8.
    # ---- speeds ----
    # Deliberately conservative defaults for a FIRST power-on test of the
    # drivetrain (see teleop.launch.py's docstring). Raise once you've
    # confirmed the robot drives/steers correctly and you're comfortable --
    # the chassis is rated up to ~1.87 m/s (docs/MOTOR_AND_GEOMETRY_VERIFICATION.md).
    max_linear: 0.30
    max_angular: 0.8
    turbo_linear: 0.5
    turbo_angular: 1.2
    deadzone: 0.08

    # ---- staleness -- see this node's own module docstring. The critical
    # network-independence property (teleop only publishing while the
    # deadman is genuinely held) comes from joy_cb() itself, not this
    # timeout -- this specifically keeps this node's OWN deadman_live
    # bookkeeping/logging from claiming "still held" forever after the
    # controller has actually gone quiet (disconnected dongle, etc.) ----
    joy_stale_timeout_s: 0.5
